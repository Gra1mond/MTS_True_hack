services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"

  lua_agent:
    build: ./lua_agent
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    volumes:
      - lua_agent_tests:/app/tests

  lua_agent_ui:
    build: ./lua_agent_ui
    depends_on:
      - lua_agent
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ws://localhost:8080/ws/generate
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  ollama_data:
  lua_agent_tests:
